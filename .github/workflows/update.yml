name: Update README Stats

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day (07:30 IST)
  workflow_dispatch:       # lets you trigger it manually from the Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # needed to push the updated SVGs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        run: python today.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shellghostt
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Move snake into assets
        run: cp dist/*.svg assets/

      - name: Commit & push if changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add assets
          git diff --staged --quiet || \
            git commit -m "chore: update README header [skip ci]" && git push
